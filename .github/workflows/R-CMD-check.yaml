# R CMD check on every push and pull request.
#
# The numerics here are hand-written C++ compiled by R CMD INSTALL, so a good share of
# what can break is compiler-specific, and a compiler difference is invisible on the
# machine that wrote the code. That is what the matrix below is for: macOS builds with
# clang, Ubuntu with gcc, Windows with the Rtools toolchain, and R-devel catches a change
# in R before it reaches release.

on:
  push:
    branches: [main, master, r-package]
  pull_request:
    branches: [main, master, r-package]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

      # O codigo da documentacao contra o pacote instalado: cada funcao e cada argumento
      # citados no README, no SKILL e nas vinhetas existem, e o quick start roda inteiro.
      - name: Check the documented code
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript tools/check_docs.R .

      # As duas instrucoes de instalacao do README, como um usuario as roda, do commit deste
      # push; o quick start roda de novo com cada copia instalada.
      - name: Install the way the README says
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: |
          mkdir -p /tmp/lib-tarball /tmp/lib-remotes
          Rscript -e 'install.packages("https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz", repos = NULL, type = "source", lib = "/tmp/lib-tarball")'
          Rscript -e 'remotes::install_github("${{ github.repository }}@${{ github.sha }}", lib = "/tmp/lib-remotes", upgrade = "never")'
          Rscript tools/check_docs.R . /tmp/lib-tarball
          Rscript tools/check_docs.R . /tmp/lib-remotes
